Alias /sql-ledger/ "/sql-ledger/"

<Directory "/sql-ledger">
    Options +ExecCGI -Indexes -FollowSymLinks
    AddHandler cgi-script .pl
    DirectoryIndex index.html
    Require all granted
</Directory>

# Never expose the source repository or the CLI installer over HTTP.
<Directory "/sql-ledger/.git">
    Require all denied
</Directory>

<Files "setup.pl">
    Require all denied
</Files>
